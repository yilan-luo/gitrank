[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitrank"
version = "0.1.0"
description = "GitHub repository ranking TUI tool - discover trending repos beyond the 1-month window"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "textual>=0.52.0",
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
gitrank = "gitrank.main:app"

[tool.setuptools.packages.find]
include = ["gitrank*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
